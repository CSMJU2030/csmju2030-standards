# REFERENCE ONLY — see the header of ruleset-main-protection.yml. The
# importable payloads are ruleset-branch-naming.{org,repo}.json.
#
# WARNING: this ruleset forces every other branch to match
# feature/<subsystem>/<slug>. It excludes only the two long-lived branches,
# refs/heads/main and refs/heads/develop (github-workflow.md 1.5), so a repo
# whose default branch is still `master` would have its own default branch
# rejected. Rename such repos to `main` before applying — as of
# 2026-09-04 CSMJU2030/csmju-equipment still defaults to `master`.
#
# refs/heads/dependabot/** is excluded too: Dependabot names its branches itself
# (dependabot/<ecosystem>/<path>/<package>-<version>) and the prefix cannot be
# configured, so without the exclusion every Dependabot push is rejected (GH-01
# in scripts/check-branch-name.sh accepts the same prefix). Repos that already
# have this ruleset keep the old payload until `apply-rulesets.sh repo <repo>`
# is run again (the sweep only creates missing rulesets).

name: csmju2030-branch-naming
enforcement: active
target: branch

conditions:
  repository_name:              # org-level only; omit in the repo-level form
    include: ["csmju-*"]
  ref_name:
    include: ["refs/heads/**"]
    exclude: ["refs/heads/main", "refs/heads/develop", "refs/heads/dependabot/**"]

rules:
  - type: branch_name_pattern
    parameters:
      operator: regex
      pattern: "^feature/[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$"
      negate: false
      name: "feature/<subsystem>/<slug>"
