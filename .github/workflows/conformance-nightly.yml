# Runtime conformance — ยิงระบบที่รันอยู่จริงผ่าน HTTP
#
# ต่างจาก subsystem-compliance.yml ที่ตรวจซอร์สโค้ดแบบ static:
# workflow นี้ต้องมี Core Hub + ระบบย่อย + PostgreSQL รันอยู่จริง จึงไม่รันทุก PR
# ใช้แบบ nightly และก่อน release ตาม docs/conformance.md ข้อ 5
name: Runtime Conformance (nightly)

on:
  schedule:
    - cron: '0 19 * * *'      # 02:00 ตามเวลาไทย
  workflow_dispatch:
    inputs:
      subsystem_url:
        description: 'base URL ของระบบย่อยที่รันอยู่'
        required: true
        type: string
      core_hub_url:
        description: 'base URL ของ Core Hub'
        required: false
        default: 'http://localhost:3000'
        type: string
      level:
        description: 'ระดับ conformance'
        required: false
        default: 'L3'
        type: choice
        options: [L1, L2, L3]

jobs:
  conformance:
    name: Runtime Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve runner path
        id: runner
        run: |
          if [[ -f standards/conformance/run.js ]]; then
            echo "path=standards/conformance/run.js" >> "$GITHUB_OUTPUT"
          else
            echo "path=conformance/run.js" >> "$GITHUB_OUTPUT"
          fi

      - name: Run conformance suite
        env:
          CONFORMANCE_URL: ${{ inputs.subsystem_url }}
          CONFORMANCE_CORE_HUB: ${{ inputs.core_hub_url }}
          CONFORMANCE_LEVEL: ${{ inputs.level }}
        run: |
          ARGS=""
          [[ -n "$CONFORMANCE_URL" ]] && ARGS="$ARGS --url $CONFORMANCE_URL"
          [[ -n "$CONFORMANCE_CORE_HUB" ]] && ARGS="$ARGS --core-hub $CONFORMANCE_CORE_HUB"
          [[ -n "$CONFORMANCE_LEVEL" ]] && ARGS="$ARGS --level $CONFORMANCE_LEVEL"
          node "${{ steps.runner.outputs.path }}" $ARGS --json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: ignore
