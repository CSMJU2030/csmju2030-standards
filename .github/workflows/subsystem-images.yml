name: CSMJU2030 Subsystem Images (Reusable)

# Called from every csmju-<subsystem> repo's .github/workflows/images.yml
# (templates/images.yml) on each push to main or develop. Builds the two images
# of docs/deployment.md 3 from the repo's own Dockerfiles and pushes them to
# GitHub Container Registry, where the server pulls them:
#
#   ghcr.io/<org>/<repo>-api   ← backend/Dockerfile
#   ghcr.io/<org>/<repo>-web   ← frontend/Dockerfile
#
# Tags: the branch name (main · develop) that the server follows, and
# sha-<7 chars> of the commit for rolling back (deployment.md 5). The
# buildcache tag holds the layer cache of the next build.
#
# A part whose Dockerfile does not exist yet is skipped with a notice, so
# images.yml can go into every repo before the teams have Dockerfiles
# (DEP-01 makes them required from standards 1.8.0).
#
# Plain docker CLI on purpose: the org allows only GitHub-owned actions plus a
# short list (org-settings/org-settings-checklist.md), and docker/buildx is
# already on the runner. The caller grants packages: write — a called workflow
# cannot raise the permissions of GITHUB_TOKEN. The label
# org.opencontainers.image.source links each package to its repo, so the
# package is as private as the repo.

on:
  workflow_call:

jobs:
  image:
    name: Image (${{ matrix.part }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: api
            dockerfile: backend/Dockerfile
          - part: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Find ${{ matrix.dockerfile }}
        id: plan
        run: |
          if [[ ! -f "${{ matrix.dockerfile }}" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ไม่มี ${{ matrix.dockerfile }} — ข้าม image ${{ matrix.part }} (deployment.md ข้อ 3)"
            exit 0
          fi
          # GHCR names must be lowercase
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}-${{ matrix.part }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.plan.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

          branch_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9_.-' '-' | cut -c1-120)"
          sha_tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"

          # the docker-container driver can export the layer cache; the default driver cannot
          docker buildx create --use --name csmju-images >/dev/null
          # build context = repo root: pnpm keeps the lockfile there, and the
          # root .dockerignore keeps .env and node_modules out (DEP-03)
          docker buildx build . \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:$branch_tag" \
            --tag "$IMAGE:$sha_tag" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
            --push

          docker logout ghcr.io
          {
            echo "### ${{ matrix.part }}"
            echo '```'
            echo "$IMAGE:$branch_tag"
            echo "$IMAGE:$sha_tag"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
