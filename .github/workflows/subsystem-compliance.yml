name: CSMJU2030 Subsystem Compliance (Reusable)

# Called from every csmju-<subsystem> repo's .github/workflows/ci.yml,
# pinned by tag/SHA (see templates/ci.yml). Each job checks out the calling
# repo (default, into ".") plus this standards repo pinned to the same ref
# the caller pinned in its `uses:` line (into ".compliance-tools"), so the
# scripts that actually enforce the rules always come from the untouchable
# central source, never from the subsystem repo being checked.

on:
  workflow_call:
    inputs:
      subsystem_name:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '20'

jobs:
  convention-check:
    name: Convention Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        id: tools
        with:
          repository: Pimma783/csmju2030-standards
          ref: ${{ github.job_workflow_sha }}
          path: .compliance-tools
      - name: Branch naming
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-branch-name.sh . "${GITHUB_HEAD_REF}"
      - name: Commit messages
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-commit-messages.sh . "${{ github.event.pull_request.base.sha }}"
      - name: Guard CI files
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-ci-untouched.sh . "${{ github.event.pull_request.base.sha }}"

  standards-version-check:
    name: Standards Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: tools
        with:
          repository: Pimma783/csmju2030-standards
          ref: ${{ github.job_workflow_sha }}
          path: .compliance-tools
      - name: Standards submodule pointer
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-submodule-pointer.sh .

  security-scan:
    name: Security & Stack Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        id: tools
        with:
          repository: Pimma783/csmju2030-standards
          ref: ${{ github.job_workflow_sha }}
          path: .compliance-tools
      - name: Secret scan
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-no-secrets.sh .
      - name: No token in localStorage
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-no-local-storage.sh .
      - name: No self-rolled JWT verify / login
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-no-jwt-verify.sh .
      - name: DB isolation
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-db-isolation.sh .
      - name: Authorized dependencies
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-authorized-deps.sh .

  api-contract-sync:
    name: API Contract Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: tools
        with:
          repository: Pimma783/csmju2030-standards
          ref: ${{ github.job_workflow_sha }}
          path: .compliance-tools
      # API-01 รัน `pnpm run generate:openapi` ของ subsystem จริง จึงต้องมี
      # toolchain ใน job นี้ด้วย ไม่ใช่แค่ใน Code Quality — ไม่มีแล้ว check
      # จะ skip เงียบ ๆ ทั้งที่ดูเหมือนผ่าน
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install (only when a pnpm lockfile is committed)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "ไม่พบ pnpm-lock.yaml — ข้ามการติดตั้ง (API-01 จะถูก skip)"
          fi
      - name: openapi.json sync
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-openapi-sync.sh .
      - name: API conventions
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-api-conventions.sh .

  data-dictionary-compliance:
    name: Data Dictionary Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: tools
        with:
          repository: Pimma783/csmju2030-standards
          ref: ${{ github.job_workflow_sha }}
          path: .compliance-tools
      - name: Forbidden field aliases
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-field-aliases.sh .
      - name: snake_case fields
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-snake-case.sh .
      - name: No hardcoded faculty list
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-no-hardcoded-faculty.sh .
      - name: Money fields are integers
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-money-fields.sh .

  ui-token-compliance:
    name: UI Token Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: tools
        with:
          repository: Pimma783/csmju2030-standards
          ref: ${{ github.job_workflow_sha }}
          path: .compliance-tools
      - name: Design token usage
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-ui-tokens.sh .

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: tools
        with:
          repository: Pimma783/csmju2030-standards
          ref: ${{ github.job_workflow_sha }}
          path: .compliance-tools
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install (only when a pnpm lockfile is committed)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "ไม่พบ pnpm-lock.yaml — ข้ามการติดตั้ง (QA-01..04 จะถูก skip)"
          fi
      - name: QA checks (lint/typecheck/test/build/pnpm-only)
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-qa.sh .

  exception-validation:
    name: Exception Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: tools
        with:
          repository: Pimma783/csmju2030-standards
          ref: ${{ github.job_workflow_sha }}
          path: .compliance-tools
      - name: Validate .compliance-exceptions.yml
        if: always() && steps.tools.outcome == 'success'
        run: bash .compliance-tools/scripts/check-exceptions.sh .
