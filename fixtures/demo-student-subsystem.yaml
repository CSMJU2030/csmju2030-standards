# manifest ของ reference implementation — ใช้ทดสอบตัว conformance runner เอง
name: student-service
standards_version: "1.0.0"
conformance_level: L3

base_url: http://localhost:3001
core_hub_url: http://localhost:3000
callback_path: /auth/callback

public_endpoints:
  - GET /api/health
  - GET /auth/callback

probes:
  collection: /api/v1/courses
  not_found: /api/v1/courses/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/courses/not-a-uuid
  create:
    path: /api/v1/courses
    allowed_role: staff
    denied_role: student
    invalid_body:
      course_code: nope
      credits: 999
    valid_body:
      courseCode: CS777
      name: Conformance Probe
      credits: 3
